version: "3"
services:
  mysql8:
    image: mysql:8.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - # 设置初始化脚本，将 ./script/mysql/ 映射到 docker 内部执行
      - ./script/mysql/:/docker-entrypoint-initdb.d/
    ports:
      - 13316:3306